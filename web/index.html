<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Wildwood Zoo</title>
<style>
:root{
  --leaf1:#4f8a35; --leaf2:#2f5a1f; --leaf3:#1d3b13; --gold:#d8b45a; --gold2:#8a6a22;
  --cream:#fbf3d2; --wood1:#8a5a2e; --wood2:#5b3816; --ink:#1b250f;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;background:#24391a;font-family:"Trebuchet MS","Verdana",sans-serif;color:var(--cream);-webkit-user-select:none;user-select:none;touch-action:none}
#game{position:fixed;inset:0;width:100%;height:100%;display:block;cursor:crosshair}
.panel{background:linear-gradient(180deg,var(--leaf1),var(--leaf2) 60%,var(--leaf3));border:2px solid var(--gold);box-shadow:inset 0 1px 0 rgba(255,255,255,.35),inset 0 -2px 0 rgba(0,0,0,.35),0 3px 10px rgba(0,0,0,.5);border-radius:10px}
.btn{font:inherit;font-size:13px;font-weight:bold;color:var(--cream);text-shadow:0 1px 0 #000;background:linear-gradient(180deg,#77b04d,#3f7326 55%,#2d5419);border:2px solid var(--gold2);border-top-color:#e9cf85;border-left-color:#e9cf85;border-radius:8px;padding:6px 10px;cursor:pointer;white-space:nowrap}
.btn:active,.btn.on{background:linear-gradient(180deg,#e6c86a,#b88f2f 60%,#7a5b18);border-color:#5a4210;border-bottom-color:#f2dc98;border-right-color:#f2dc98;color:#fff}
.btn:disabled{opacity:.45}
.btn.red{background:linear-gradient(180deg,#d6694b,#9b3418 60%,#6a210c)}
#top{position:fixed;left:6px;right:6px;top:calc(6px + env(safe-area-inset-top));display:flex;align-items:center;gap:8px;padding:5px 8px;z-index:5;flex-wrap:wrap}
#logo{font-family:Georgia,serif;font-weight:bold;font-size:18px;color:#ffe9a0;text-shadow:0 2px 0 #3a2a08,0 0 6px rgba(0,0,0,.6);letter-spacing:.5px;display:flex;align-items:center;gap:6px}
.stat{background:rgba(0,0,0,.28);border:1px solid rgba(255,230,150,.35);border-radius:7px;padding:3px 8px;font-size:13px;font-weight:bold;display:flex;align-items:center;gap:5px;cursor:pointer}
#stars{position:relative;display:inline-block;font-size:15px;letter-spacing:1px;color:rgba(0,0,0,.35);text-shadow:none}#stars .f{position:absolute;left:0;top:0;overflow:hidden;white-space:nowrap;color:#ffd54a;text-shadow:0 1px 0 #6a4a00}
.spacer{flex:1}
#speed .btn{padding:4px 8px;font-size:12px}
#bottom{position:fixed;left:6px;right:6px;bottom:calc(6px + env(safe-area-inset-bottom));z-index:5;display:flex;flex-direction:column;gap:6px;pointer-events:none}
#tray{pointer-events:auto;padding:8px;display:none;max-height:42vh;overflow:auto}
#tray.open{display:block}
#trayTitle{font-weight:bold;color:#ffe9a0;font-size:14px;margin-bottom:6px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
#trayItems{display:flex;align-items:flex-start;gap:6px;overflow-x:auto;padding-bottom:4px;flex-wrap:nowrap}
.item{flex:0 0 auto;width:96px;background:rgba(0,0,0,.25);border:2px solid rgba(216,180,90,.5);border-radius:8px;padding:4px;text-align:center;cursor:pointer;font-size:11px;line-height:1.2}
.item canvas{width:86px;height:58px;display:block;margin:0 auto 2px;background:radial-gradient(ellipse at 50% 70%,#7fb35a,#3d6e27);border-radius:5px}
.item.sel{border-color:#ffe08a;background:rgba(255,220,120,.25);box-shadow:0 0 8px #ffd96b}
.item .c{color:#ffe08a;font-weight:bold}
.item .b{color:#cfe6b5;font-size:10px}
#tools{pointer-events:auto;display:flex;gap:5px;padding:6px;overflow-x:auto}
#tools .btn{display:flex;flex-direction:column;align-items:center;gap:1px;font-size:10.5px;padding:4px 7px;min-width:58px}
#tools .btn .i{font-size:19px;line-height:1.1}
#info{position:fixed;right:8px;top:70px;width:300px;max-width:calc(100vw - 16px);z-index:6;padding:10px;display:none;max-height:calc(100vh - 230px);overflow:auto}
#info.open{display:block}
#info h3{margin:0 0 4px;font-family:Georgia,serif;color:#ffe9a0;font-size:17px}
#info .sub{font-size:12px;color:#d7ecc2;margin-bottom:6px}
.bar{display:flex;align-items:center;gap:6px;font-size:11.5px;margin:3px 0}
.bar span:first-child{width:74px;flex:none}
.bar .track{flex:1;height:10px;background:rgba(0,0,0,.4);border-radius:5px;overflow:hidden;border:1px solid rgba(0,0,0,.4)}
.bar .fill{height:100%;border-radius:5px}
.tips{margin:6px 0;padding:6px 8px;background:rgba(0,0,0,.25);border-radius:6px;font-size:12px}
.tips div{margin:2px 0}
.thought{font-style:italic;font-size:12px;margin:3px 0;padding:4px 8px;background:#fffbe6;color:#3a2f10;border-radius:10px;position:relative}
.row{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
#close{position:absolute;right:8px;top:6px;padding:2px 8px}
#toasts{position:fixed;left:50%;transform:translateX(-50%);top:78px;z-index:7;display:flex;flex-direction:column;gap:5px;align-items:center;pointer-events:none;width:min(560px,94vw)}
.toast{background:rgba(25,40,15,.92);border:2px solid var(--gold);border-radius:9px;padding:6px 12px;font-size:13px;box-shadow:0 3px 8px rgba(0,0,0,.5);animation:pop .25s ease-out;text-align:center}
.toast.alert{background:rgba(120,25,10,.95);border-color:#ffb08a}
.toast.good{background:rgba(110,80,10,.95);border-color:#ffe08a}
@keyframes pop{from{transform:scale(.8);opacity:0}to{transform:scale(1);opacity:1}}
#cursorTip{position:fixed;z-index:8;pointer-events:none;background:rgba(15,25,8,.9);border:1px solid var(--gold);border-radius:6px;padding:3px 7px;font-size:12px;display:none;white-space:nowrap}
#modal{position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:20;display:none;align-items:center;justify-content:center}
#modal.open{display:flex}
#modalBox{width:min(520px,94vw);max-height:86vh;overflow:auto;padding:16px}
#modalBox h2{font-family:Georgia,serif;color:#ffe9a0;margin:0 0 8px}
table.led{width:100%;border-collapse:collapse;font-size:13px}
table.led td{padding:3px 4px;border-bottom:1px solid rgba(255,255,255,.12)}
table.led td.n{text-align:right;font-family:monospace;font-size:13px}
.goal{display:flex;gap:8px;align-items:center;padding:4px 0;border-bottom:1px solid rgba(255,255,255,.1);font-size:13px}
.goal .ck{width:20px;height:20px;border-radius:50%;border:2px solid var(--gold);display:flex;align-items:center;justify-content:center;font-size:12px;flex:none}
.goal.done .ck{background:#e6c86a;color:#3a2a00}
.goal.done{color:#ffe9a0}
#walkWrap{position:fixed;inset:0;z-index:15;background:#000;display:none}
#walkWrap.open{display:block}
#walkCanvas{position:absolute;inset:0;width:100%;height:100%;image-rendering:pixelated;image-rendering:crisp-edges}
#walkHud{position:absolute;left:8px;top:calc(8px + env(safe-area-inset-top));right:8px;display:flex;gap:8px;align-items:center;padding:6px 10px}
#dpad{position:absolute;left:14px;bottom:calc(18px + env(safe-area-inset-bottom));display:grid;grid-template-columns:repeat(3,58px);grid-template-rows:repeat(2,58px);gap:6px}
#dpad .btn{font-size:22px;padding:0;opacity:.85}
#walkTip{font-size:12px;color:#d7ecc2}
.kv{display:flex;justify-content:space-between;font-size:13px;padding:2px 0}
input[type=range]{width:100%;accent-color:#e6c86a}
.chip{display:inline-block;padding:1px 7px;border-radius:10px;background:rgba(0,0,0,.3);font-size:11px;margin:1px}
#term{position:fixed;left:50%;transform:translateX(-50%);top:70px;width:min(760px,96vw);height:min(440px,62vh);z-index:25;display:none;flex-direction:column;background:#050a04;border:2px solid #6fbf4a;border-radius:6px;box-shadow:0 0 0 2px #000,0 0 24px rgba(80,255,80,.25),0 8px 30px rgba(0,0,0,.7);font-family:"Lucida Console","Courier New",monospace}
#term.open{display:flex}
#termBar{display:flex;align-items:center;gap:8px;padding:4px 8px;background:linear-gradient(180deg,#2c5a1c,#163010);color:#d9ffc4;font-size:12px;font-weight:bold;border-bottom:1px solid #6fbf4a}
#termOut{flex:1;overflow:auto;padding:8px 10px;color:#7dff6a;font-size:12.5px;line-height:1.35;white-space:pre-wrap;text-shadow:0 0 4px rgba(90,255,90,.45);background:repeating-linear-gradient(0deg,rgba(0,0,0,.18) 0 1px,transparent 1px 3px)}
#termOut .u{color:#e8ffd8}
#termOut .w{color:#ffd76a}
#termLine{display:flex;align-items:center;gap:6px;padding:6px 10px;border-top:1px solid #234a18;color:#7dff6a}
#termIn{flex:1;background:transparent;border:none;outline:none;color:#e8ffd8;font:inherit;font-size:16px;caret-color:#7dff6a}
#termBtn{font-family:"Lucida Console",monospace;padding:4px 7px}
#loading{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;z-index:30;background:#24391a;font-family:Georgia,serif;font-size:22px;color:#ffe9a0}
@media (max-width:640px){
  #logo{display:none}
  #speed{gap:2px!important}
  #speed .btn{padding:3px 5px;font-size:10px;letter-spacing:-1px}
  #termBtn,#menuBtn{padding:3px 6px;font-size:11px}
  #stDate{font-size:10.5px;padding:2px 5px}
  .spacer{display:none}
  #top{gap:5px;padding:4px 6px}
  .stat{font-size:12px;padding:2px 6px}
  #info{top:auto;bottom:150px;right:6px;left:6px;width:auto;max-height:46vh}
  #toasts{top:118px}
  #term{top:auto;bottom:calc(8px + env(safe-area-inset-bottom));height:52vh}
  #trayTitle{font-size:12px}
  .item{width:84px}
  .item canvas{width:76px;height:51px}
  #tools .btn{min-width:52px;font-size:9.5px}
}
</style>
</head>
<body>
<div id="loading">Opening the gates…</div>
<canvas id="game"></canvas>

<div id="top" class="panel">
  <div id="logo">🦒 <span class="t">Wildwood Zoo</span></div>
  <div class="stat" id="stCash" title="Finances">💰 <span id="cash">$0</span></div>
  <div class="stat" id="stFame" title="Zoo fame"><span id="stars">★★★★★<span class="f" id="starsF">★★★★★</span></span></div>
  <div class="stat" id="stGuests" title="Guests">🧑‍🤝‍🧑 <span id="guests">0</span></div>
  <div class="stat" id="stAnimals" title="Animals">🐾 <span id="animals">0</span></div>
  <div class="stat" id="stDate">📅 <span id="date"></span></div>
  <div class="spacer"></div>
  <div id="speed" style="display:flex;gap:3px">
    <button class="btn" data-s="0" title="Pause">❚❚</button>
    <button class="btn on" data-s="1" title="Normal">▶</button>
    <button class="btn" data-s="2" title="Fast">▶▶</button>
    <button class="btn" data-s="4" title="Fastest">▶▶▶</button>
  </div>
  <button class="btn" id="termBtn" title="Terminal (~)">&gt;_</button>
  <button class="btn" id="menuBtn" title="Menu">☰</button>
</div>

<div id="info" class="panel"><button class="btn" id="close">✕</button><div id="infoBody"></div></div>
<div id="toasts"></div>
<div id="cursorTip"></div>

<div id="bottom">
  <div id="tray" class="panel"><div id="trayTitle"></div><div id="trayItems"></div></div>
  <div id="tools" class="panel"></div>
</div>

<div id="walkWrap">
  <canvas id="walkCanvas"></canvas>
  <div id="walkHud" class="panel">
    <b style="color:#ffe9a0">🚶 Zoo Walk</b>
    <span id="walkTip">WASD / arrows to walk · hold Shift to run · drag to look around</span>
    <div class="spacer"></div>
    <button class="btn red" id="walkExit">Exit</button>
  </div>
  <div id="dpad">
    <span></span><button class="btn" data-k="f">▲</button><span></span>
    <button class="btn" data-k="l">⟲</button><button class="btn" data-k="b">▼</button><button class="btn" data-k="r">⟳</button>
  </div>
</div>

<div id="term"><div id="termBar">ZOO TERMINAL <span style="font-weight:normal;opacity:.7">type "help" or "cheats"</span><div class="spacer"></div><button class="btn" style="padding:1px 8px" id="termClose">✕</button></div><div id="termOut"></div><div id="termLine">&gt;<input id="termIn" autocomplete="off" autocapitalize="off" spellcheck="false"></div></div>
<div id="modal"><div id="modalBox" class="panel"></div></div>

<script>
"use strict";
const WASM_B64 = "__WASM_B64__";

// ===================== WASM bootstrap =====================
let X = null, W = 56, H = 56, DEFS = null;
const dec = new TextDecoder();
function outStr(n){ return dec.decode(new Uint8Array(X.memory.buffer, X.out_ptr(), n)); }
function J(n){ return JSON.parse(outStr(n)); }
const enc = new TextEncoder();
function putStr(s){ const b = enc.encode(s); const p = X.alloc_in(b.length); new Uint8Array(X.memory.buffer, p, b.length).set(b); }
let T, O, FH, FV, DUNG, LIT, REG;
function views(){
  const b = X.memory.buffer;
  T = new Uint8Array(b, X.terrain_ptr(), W*H);
  O = new Uint8Array(b, X.obj_ptr(), W*H);
  FH = new Uint8Array(b, X.fh_ptr(), W*(H+1));
  FV = new Uint8Array(b, X.fv_ptr(), (W+1)*H);
  DUNG = new Uint8Array(b, X.dung_ptr(), W*H);
  LIT = new Uint8Array(b, X.litter_ptr(), W*H);
  REG = new Uint16Array(b, X.region_ptr(), W*H);
}
async function boot(){
  const bin = Uint8Array.from(atob(WASM_B64), c => c.charCodeAt(0));
  const { instance } = await WebAssembly.instantiate(bin, {});
  X = instance.exports;
  X.init((Math.random()*1e9)|0);
  W = X.map_w(); H = X.map_h();
  buildOrder();
  DEFS = J(X.defs());
  buildTools();
  let loaded = false;
  try { const s = localStorage.getItem("wildwood_save"); if (s && new URLSearchParams(location.search).get("new")===null) loaded = loadFrom(s, true); } catch(e) {}
  { const st0 = J(X.stats()); own = st0.own; homeView(); }
  document.getElementById("loading").remove();
  resize();
  requestAnimationFrame(frame);
  if (!loaded) setTimeout(()=>showHelp(true), 300);
}

// ===================== View / projection =====================
const cv = document.getElementById("game"); let ctx = cv.getContext("2d");
let cw = 0, ch = 0, dpr = 1;
const view = { cx: 64, cy: 116, zoom: 1, rot: 0 };
let own = [0, 0, 128, 128];
function homeView(){ view.cx = (own[0]+own[2])/2; view.cy = own[3]-12; }
function resize(){
  dpr = Math.min(window.devicePixelRatio || 1, 2);
  cw = innerWidth; ch = innerHeight;
  cv.width = cw*dpr; cv.height = ch*dpr;
  if (innerWidth < 640 && !resize.done) { view.zoom = 0.8; }
  resize.done = true;
}
addEventListener("resize", resize);
function rotP(x,y){ switch(view.rot){case 0:return [x,y];case 1:return [W-y,x];case 2:return [W-x,H-y];default:return [y,H-x];} }
function unrot(rx,ry){ switch(view.rot){case 0:return [rx,ry];case 1:return [ry,W-rx];case 2:return [W-rx,H-ry];default:return [H-ry,rx];} }
function hw(){ return 32*view.zoom } function hh(){ return 16*view.zoom }
function proj(x,y){
  const r = rotP(x,y), c = rotP(view.cx,view.cy);
  return [ (r[0]-r[1]-(c[0]-c[1]))*hw() + cw/2, (r[0]+r[1]-(c[0]+c[1]))*hh() + ch/2 ];
}
function unproj(sx,sy){
  const c = rotP(view.cx,view.cy);
  const a = (sx-cw/2)/hw() + (c[0]-c[1]), b = (sy-ch/2)/hh() + (c[0]+c[1]);
  return unrot((a+b)/2, (b-a)/2);
}
const faceMul = () => [1,-1,-1,1][view.rot];
let tileOrder = [];
function buildOrder(){
  tileOrder = [];
  for (let i=0;i<W*H;i++) tileOrder.push(i);
  const key = i => { const r = rotP(i%W+0.5, (i/W|0)+0.5); return (r[0]+r[1])*1000 + r[0]; };
  tileOrder.sort((a,b)=>key(a)-key(b));
}
function depth(x,y){ const r = rotP(x,y); return r[0]+r[1]; }

// ===================== Helpers =====================
function hash(n){ n = Math.imul(n ^ 0x9e3779b9, 0x85ebca6b); n ^= n>>>13; n = Math.imul(n, 0xc2b2ae35); n ^= n>>>16; return (n>>>0)/4294967296; }
function shade(c,k){ return `rgb(${Math.min(255,c[0]*k)|0},${Math.min(255,c[1]*k)|0},${Math.min(255,c[2]*k)|0})`; }
function ell(x,y,rx,ry,fill){ ctx.beginPath(); ctx.ellipse(x,y,Math.max(.1,rx),Math.max(.1,ry),0,0,Math.PI*2); ctx.fillStyle=fill; ctx.fill(); }
function poly(pts,fill,stroke){ ctx.beginPath(); ctx.moveTo(pts[0],pts[1]); for(let i=2;i<pts.length;i+=2) ctx.lineTo(pts[i],pts[i+1]); ctx.closePath(); if(fill){ctx.fillStyle=fill;ctx.fill();} if(stroke){ctx.strokeStyle=stroke;ctx.stroke();} }
function money(v){ return (v<0?"-$":"$") + Math.abs(Math.round(v)).toLocaleString(); }

// ===================== Terrain rendering =====================
const TCOL = [[96,160,66],[196,178,100],[150,114,76],[228,208,150],[236,242,250],[142,138,132],[64,124,190],[208,198,180],[70,92,46]];
let time = 0;
function drawTile(i, sx, sy){
  const t = T[i], a = hw(), b = hh();
  const v = 0.94 + hash(i)*0.1;
  let col = TCOL[t];
  const pad = 0.6;
  ctx.beginPath(); ctx.moveTo(sx, sy-b-pad); ctx.lineTo(sx+a+pad, sy); ctx.lineTo(sx, sy+b+pad); ctx.lineTo(sx-a-pad, sy); ctx.closePath();
  if (t === 6) {
    const w = Math.sin(time*1.6 + (i%W)*0.7 + (i/W|0)*0.5)*8;
    ctx.fillStyle = `rgb(${60+w|0},${122+w|0},${190+w|0})`; ctx.fill();
    if (view.zoom > 0.6) { ctx.strokeStyle = "rgba(255,255,255,.35)"; ctx.lineWidth = 1; ctx.beginPath(); const o = Math.sin(time+i)*a*0.3; ctx.moveTo(sx-a*0.35+o, sy); ctx.lineTo(sx-a*0.05+o, sy-b*0.15); ctx.stroke(); }
    return;
  }
  ctx.fillStyle = shade(col, v); ctx.fill();
  if (view.zoom < 0.55) return;
  const h1 = hash(i*7+1), h2 = hash(i*13+5);
  ctx.lineWidth = Math.max(1, view.zoom);
  switch (t) {
    case 0: ctx.strokeStyle = "rgba(40,100,30,.45)"; ctx.beginPath(); for(let k=0;k<3;k++){const px=sx+(hash(i*3+k)-.5)*a*1.1, py=sy+(hash(i*5+k)-.5)*b*1.1; ctx.moveTo(px,py); ctx.lineTo(px+1,py-3*view.zoom);} ctx.stroke(); break;
    case 1: ctx.strokeStyle = "rgba(140,110,40,.6)"; ctx.beginPath(); for(let k=0;k<5;k++){const px=sx+(hash(i*3+k)-.5)*a*1.2, py=sy+(hash(i*5+k)-.5)*b*1.2; ctx.moveTo(px,py); ctx.lineTo(px-2*view.zoom,py-5*view.zoom); ctx.moveTo(px,py); ctx.lineTo(px+2*view.zoom,py-5*view.zoom);} ctx.stroke(); break;
    case 2: ell(sx+(h1-.5)*a, sy+(h2-.5)*b, 3*view.zoom, 1.5*view.zoom, "rgba(100,70,40,.4)"); break;
    case 3: ell(sx+(h1-.5)*a, sy+(h2-.5)*b*0.8, 6*view.zoom, 1.2*view.zoom, "rgba(190,160,100,.4)"); break;
    case 4: ell(sx+(h1-.5)*a, sy+(h2-.5)*b, 2*view.zoom, 1*view.zoom, "rgba(170,200,230,.55)"); break;
    case 5: ctx.strokeStyle = "rgba(80,76,70,.6)"; ctx.beginPath(); ctx.moveTo(sx-a*0.4+h1*a*.3, sy-b*0.1); ctx.lineTo(sx, sy+b*0.2*h2); ctx.lineTo(sx+a*0.3, sy-b*0.2); ctx.stroke(); break;
    case 7: { ctx.strokeStyle = "rgba(120,110,95,.5)"; ctx.beginPath(); ctx.moveTo(sx-a,sy); ctx.lineTo(sx,sy-b); ctx.lineTo(sx+a,sy); ctx.stroke(); break; }
    case 8: for(let k=0;k<3;k++) ell(sx+(hash(i*3+k)-.5)*a*1.1, sy+(hash(i*9+k)-.5)*b, 3*view.zoom, 1.4*view.zoom, k%2?"rgba(110,80,40,.5)":"rgba(40,90,30,.5)"); break;
  }
}

// ===================== Fences =====================
const FENCE_H = [0, 13, 15, 19];
function drawEdge(x0,y0,x1,y1,val){
  const p0 = proj(x0,y0), p1 = proj(x1,y1), z = view.zoom;
  const kind = val & 3, gate = (val & 4) !== 0, h = FENCE_H[kind]*z;
  ctx.lineCap = "round";
  if (kind === 3) {
    const dx = p1[0]-p0[0];
    poly([p0[0],p0[1],p1[0],p1[1],p1[0],p1[1]-h,p0[0],p0[1]-h], gate?"#8b6a3e": (dx*(p1[1]-p0[1])>0 ? "#b9b4a8" : "#cfcabd"), "rgba(60,55,50,.6)");
    poly([p0[0],p0[1]-h,p1[0],p1[1]-h,p1[0],p1[1]-h-2*z,p0[0],p0[1]-h-2*z], "#e2ddd0");

  }
  if (panStart) {
    const dx = e.clientX-panStart.x, dy = e.clientY-panStart.y;
    if (Math.abs(dx)+Math.abs(dy) > 6) panStart.moved = true;
    if (panStart.moved) panBy(dx, dy, panStart.cx, panStart.cy);
    return;
  }

function panBy(dx, dy, cx0, cy0){

const keys = {};
addEventListener("keydown", e => {
  if (e.key === "`" || e.key === "~") { e.preventDefault(); toggleTerm(); return; }
  if (e.target.tagName === "INPUT" || e.target.tagName === "TEXTAREA") return;
  if (e.key === "$") { X.money_cheat(); return; }
  keys[e.key.toLowerCase()] = true;
  if (!walkMode) { if (e.key === "q" || e.key === "Q") rotate(-1); if (e.key === "e" || e.key === "E") rotate(1); if (e.key === "Escape") { pickCat("select"); closeInfo(); } if (e.key===" ") { setSpeed(speed?0:1); e.preventDefault(); } }

addEventListener("keyup", e => { keys[e.key.toLowerCase()] = false; });
function keyPan(dt){

  if (keys["arrowleft"]||keys["a"]) dx += s; if (keys["arrowright"]||keys["d"]) dx -= s;
  if (keys["arrowup"]||keys["w"]) dy += s; if (keys["arrowdown"]||keys["s"]) dy -= s;

function applyToolAt(fx, fy, first){
  const x = Math.floor(fx), y = Math.floor(fy);
  if (!inMap(x,y) && tool.type !== "fence") return;
  const key = x+","+y;
  switch (tool.type) {
    case "terrain": if (!drag.painted.has(key)) { drag.painted.add(key); X.paint_terrain(x, y, tool.t, brush); } break;
    case "path": if (!drag.painted.has(key)) { drag.painted.add(key); X.paint_terrain(x, y, 7, 0); } break;
    case "object": if (!drag.painted.has(key)) { drag.painted.add(key); const r = X.place_object(x, y, tool.k); if (r === -2 && first) toast("Something is already there."); } break;
    case "animal": if (first) { const r = X.adopt(x, y, tool.sp, adoptMale?1:0); if (r > 0) { selected = {kind:'ent', id:r}; refreshInfo(); } } break;
    case "gate": if (first) X.toggle_gate(fx, fy); break;
    case "bulldoze": if (!drag.painted.has(key) || first) { drag.painted.add(key); X.bulldoze(fx, fy); } break;
  }
}
function clickSelect(fx, fy){
  const id = X.pick(fx, fy);

  else { selected = null; }
  refreshInfo(true);
}

function diamond(x, y, fill, stroke){ const [sx,sy] = proj(x+0.5,y+0.5), a=hw(), b=hh(); ctx.beginPath(); ctx.moveTo(sx,sy-b); ctx.lineTo(sx+a,sy); ctx.lineTo(sx,sy+b); ctx.lineTo(sx-a,sy); ctx.closePath(); if(fill){ctx.fillStyle=fill;ctx.fill();} if(stroke){ctx.strokeStyle=stroke;ctx.lineWidth=2;ctx.stroke();} }
function drawPreview(){
  if (!hover || tool.type === "select") return;
  const {x, y} = hover;
  if (tool.type === "fence" && drag) {
    const ax=Math.min(drag.sx,drag.cx), bx=Math.max(drag.sx,drag.cx), ay=Math.min(drag.sy,drag.cy), by=Math.max(drag.sy,drag.cy);
    for (let yy=ay; yy<=by; yy++) for (let xx=ax; xx<=bx; xx++) if (inMap(xx,yy)) diamond(xx,yy,"rgba(255,230,120,.22)");
    const p = [proj(ax,ay),proj(bx+1,ay),proj(bx+1,by+1),proj(ax,by+1)];
    ctx.strokeStyle = "#ffe066"; ctx.lineWidth = 3; ctx.beginPath(); ctx.moveTo(...p[0]); for (const q of p.slice(1)) ctx.lineTo(...q); ctx.closePath(); ctx.stroke();
    return;
  }
  if (!inMap(x,y)) return;
  if (!isOwned(x,y)) { diamond(x,y,"rgba(255,80,60,.25)","rgba(255,120,90,.7)"); return; }
  if (tool.type === "terrain") { const r = brush; for (let dy=-r;dy<=r;dy++) for (let dx=-r;dx<=r;dx++) if (r===0 || dx*dx+dy*dy <= r*r+r) if (inMap(x+dx,y+dy)) diamond(x+dx,y+dy,"rgba(255,255,255,.18)","rgba(255,255,255,.5)"); return; }
  if (tool.type === "bulldoze") { diamond(x,y,"rgba(255,80,60,.3)","#ff6a4a"); return; }
  if (tool.type === "object") { const ok = O[y*W+x]===0 && T[y*W+x]!==6; diamond(x,y, ok?"rgba(120,255,120,.25)":"rgba(255,80,60,.3)"); if (ok) { ctx.globalAlpha = .6; const [sx,sy]=proj(x+.5,y+.5); drawObjectAt(tool.k, sx, sy); ctx.globalAlpha = 1; } return; }
  if (tool.type === "animal") { const ok = REG[y*W+x] !== X.outside_region(); diamond(x,y, ok?"rgba(120,255,120,.25)":"rgba(255,80,60,.3)"); return; }
  diamond(x,y,"rgba(255,255,255,.2)","rgba(255,255,255,.6)");
}

    <div style="margin-top:12px"><b>Admission price: <span id="admV">${money(s.admission)}</span></b><input type="range" min="0" max="80" step="1" value="${s.admission}" oninput="X.set_admission(+this.value);document.getElementById('admV').textContent=money(+this.value)">
    <div style="font-size:12px;color:#d7ecc2">Higher fame lets you charge more. Guests think about ${money(12+s.fame*8)} is fair right now.</div></div>
    <div class="row"><button class="btn" onclick="closeModal()">Close</button></div>`);
}
function showStatus(){
  const s = lastStats || J(X.stats());
  modal(`<h2>Zoo Status</h2><div style="font-size:26px;color:#ffd54a">${stars(s.fame)}</div><div class="kv"><span>Zoo fame</span><b>${s.fame.toFixed(2)} / 5</b></div>
   ${bar("Guest happiness", s.guestH)}${bar("Animal happiness", s.animalH)}${bar("Species variety", s.variety)}
   <div class="kv"><span>Guests in zoo</span><b>${s.guests}</b></div><div class="kv"><span>Total visitors</span><b>${s.visitors}</b></div>
   <div class="kv"><span>Animals</span><b>${s.animals} (${s.species} species)</b></div><div class="kv"><span>Zookeepers</span><b>${s.keepers}</b></div><div class="kv"><span>Maintenance workers</span><b>${s.maint}</b></div>
   <div class="tips">Fame rises with happy animals, happy guests and more species. More fame brings more guests.</div><div class="row"><button class="btn" onclick="closeModal()">Close</button></div>`);
}
function showGoals(){
  const s = lastStats || J(X.stats());
  modal(`<h2>Goals</h2>${DEFS.goals.map((g,i)=>`<div class="goal ${s.goals&(1<<i)?'done':''}"><div class="ck">${s.goals&(1<<i)?'✓':''}</div><div style="flex:1">${g.name}</div><div>${g.reward?money(g.reward):'🏆'}</div></div>`).join("")}<div class="row"><button class="btn" onclick="closeModal()">Close</button></div>`);
}
function showHelp(first){
  modal(`<h2>Welcome to Wildwood Zoo!</h2>${first ? '<p style="margin:4px 0"><b>Choose your starting zoo size</b> (or just close this to start Small):</p>' + SIZE_BTNS + '<hr style="border-color:rgba(255,255,255,.15)">' : ""}
  <div style="font-size:13.5px;line-height:1.5">
  <p><b>1. Build an exhibit.</b> Open <b>🚧 Fences</b> and drag a rectangle beside the path. A gate is added automatically. Bigger animals need stronger fences.</p>
  <p><b>2. Make it feel like home.</b> Every species has a native biome. Paint its <b>⛰️ Terrain</b>, plant its <b>🌳 Foliage</b>, and add a shelter, a toy and water from <b>🛖 Animal Items</b>. When you place an animal, the suitability % shows how well the exhibit fits it.</p>
  <p><b>3. Adopt animals</b> in groups of the right size, males and females, and they may have babies.</p>
  <p><b>4. Hire zookeepers</b> to feed animals and clean up dung. Unhappy animals, or animals that are too strong for their fence, will <b>break out</b>!</p>
  <p><b>5. Keep guests happy</b> with food and drink stands, restrooms, benches, trash cans and scenery beside paths. Put donation boxes near great exhibits.</p>
  <p><b>6. 🚶 Zoo Walk</b> lets you explore your zoo on foot in first person.</p>
  <p><b>7. 🗺️ Buy Land</b> when you run out of room. The darker land with FOR SALE signs can be bought in 8-tile strips.</p>

  <p style="color:#d7ecc2">Controls: drag with <b>Select</b> to pan · pinch or scroll to zoom · two fingers to pan while building · Q/E or 🔄 to rotate · space to pause.</p>
  </div><div class="row"><button class="btn" onclick="closeModal()">Let's build!</button></div>`);
}

// ===================== Save / Load =====================
function b64(u8){ let s=""; for (let i=0;i<u8.length;i+=0x8000) s += String.fromCharCode.apply(null, u8.subarray(i,i+0x8000)); return btoa(s); }
function saveData(){ const n = X.save(); return b64(new Uint8Array(X.memory.buffer, X.out_ptr(), n).slice()); }
function loadFrom(s, quiet){
  try { const bin = Uint8Array.from(atob(s.trim()), c=>c.charCodeAt(0)); const p = X.alloc_in(bin.length); new Uint8Array(X.memory.buffer, p, bin.length).set(bin); const r = X.load(); if (r !== 1) { if(!quiet) toast("That save could not be loaded.", "alert"); return false; } selected = null; lastStats = J(X.stats()); own = lastStats.own; homeView(); for (const m of lastStats.msgs) toast(m); return true; }
  catch(e){ if(!quiet) toast("That save could not be loaded.", "alert"); return false; }
}
window.saveGame = (auto) => { try { localStorage.setItem("wildwood_save", saveData()); if (!auto) { toast("Zoo saved."); closeModal(); } } catch(e){ if (!auto) toast("Saving isn't available here. Use Export save code instead.", "alert"); } };
window.loadGame = () => { try { const s = localStorage.getItem("wildwood_save"); if (!s) { toast("No saved zoo found."); return; } if (loadFrom(s)) closeModal(); } catch(e){ toast("Loading isn't available here. Use Import save code.", "alert"); } };
window.exportSave = () => modal(`<h2>Save code</h2><div style="font-size:12px;margin-bottom:6px">Copy this text somewhere safe. Import it later to restore your zoo.</div><textarea id="sc" style="width:100%;height:160px;font-size:10px" readonly>${saveData()}</textarea><div class="row"><button class="btn" onclick="const t=document.getElementById('sc');t.select();try{navigator.clipboard.writeText(t.value).then(()=>toast('Copied!'),()=>toast('Select the text and copy it manually.'))}catch(e){toast('Select the text and copy it manually.')}">Copy</button><button class="btn" onclick="closeModal()">Close</button></div>`);
window.importSave = () => modal(`<h2>Import save code</h2><textarea id="ic" style="width:100%;height:160px;font-size:10px"></textarea><div class="row"><button class="btn" onclick="if(loadFrom(document.getElementById('ic').value))closeModal()">Load</button><button class="btn" onclick="closeModal()">Cancel</button></div>`);

// ===================== Zoo Walk =====================
let walkMode = false, wimg = null;
const wc = document.getElementById("walkCanvas"), wctx = wc.getContext("2d");
const dkeys = {};
function enterWalk(x, y){
  if (x === undefined) { // from camera center: nearest path tile
    let best = null, bd = 1e9;
    for (let i=0;i<W*H;i++) if (T[i]===7) { const d = (i%W+.5-view.cx)**2 + ((i/W|0)+.5-view.cy)**2; if (d<bd){bd=d;best=i;} }
    x = best!==null ? best%W+0.5 : W/2; y = best!==null ? (best/W|0)+0.5 : H-2;
  }
  const v = [[-1,-1],[-1,1],[1,1],[1,-1]][view.rot]; // screen-up direction in world space
  X.walk_set(x, y, Math.atan2(v[1], v[0]));
  walkMode = true; sizeWalk();
  document.getElementById("walkWrap").classList.add("open");
  document.getElementById("tray").classList.remove("open");
}
function sizeWalk(){
  // Render at the screen's own shape: ~400 px wide in landscape, ~300 px wide in portrait.
  const ar = innerHeight / innerWidth, w = ar > 1 ? 300 : 400, h = Math.round(Math.min(720, Math.max(120, w * ar)));
  X.walk_resize(w, h); wc.width = X.walk_w(); wc.height = X.walk_h(); wimg = wctx.createImageData(wc.width, wc.height);
}
addEventListener("resize", () => { if (walkMode) sizeWalk(); });
window.walkFrom = (x,y) => { closeInfo(); enterWalk(x,y); };
function exitWalk(){ walkMode = false; document.getElementById("walkWrap").classList.remove("open"); view.cx = X.walk_x(); view.cy = X.walk_y(); pickCat(cat); }
document.getElementById("walkExit").onclick = exitWalk;
document.querySelectorAll("#dpad .btn").forEach(b => {
  const k = b.dataset.k;
  b.addEventListener("pointerdown", e => { e.preventDefault(); dkeys[k] = true; });
  for (const ev of ["pointerup","pointerleave","pointercancel"]) b.addEventListener(ev, () => { dkeys[k] = false; });
});
let look = null;
wc.addEventListener("pointerdown", e => { look = {x:e.clientX}; try { wc.setPointerCapture(e.pointerId); } catch (_) {} });
wc.addEventListener("pointermove", e => { if (look) { const dx = e.clientX - look.x; look.x = e.clientX; X.walk_move(0,0, dx*0.006/2.2, 1); } });
wc.addEventListener("pointerup", () => look = null);
function walkFrame(dt){
  acc += dt*speed; let steps = 0; while (acc >= 0.05 && steps < 40) { acc -= 0.05; steps++; } if (steps) X.tick(steps);
  let f = 0, s = 0, t = 0;
  if (keys["w"]||keys["arrowup"]||dkeys.f) f += 1; if (keys["s"]||keys["arrowdown"]||dkeys.b) f -= 1;
  if (keys["a"]) s -= 1; if (keys["d"]) s += 1;
  if (keys["arrowleft"]||keys["q"]||dkeys.l) t -= 1; if (keys["arrowright"]||keys["e"]||dkeys.r) t += 1;
  if (keys["shift"]) f *= 2.2;
  X.walk_move(f, s, t, dt);
  const ptr = X.walk_render(dt);
  wimg.data.set(new Uint8ClampedArray(X.memory.buffer, ptr, wc.width*wc.height*4));
  wctx.putImageData(wimg, 0, 0);
  // keep aspect: cover
  const ar = wc.width / wc.height, sr = innerWidth / innerHeight;
  if (sr > ar) { wc.style.width = "100%"; wc.style.height = (innerWidth/ar)+"px"; wc.style.top = ((innerHeight - innerWidth/ar)/2)+"px"; wc.style.left="0"; }
  else { wc.style.height = "100%"; wc.style.width = (innerHeight*ar)+"px"; wc.style.left = ((innerWidth - innerHeight*ar)/2)+"px"; wc.style.top="0"; }
  uiTick(performance.now());
}

// ===================== Terminal =====================
const term = document.getElementById("term"), termOut = document.getElementById("termOut"), termIn = document.getElementById("termIn");
const termHist = []; let termHi = 0, termGreeted = false;
function termPrint(t, cls){ const d = document.createElement("div"); if (cls) d.className = cls; d.textContent = t; termOut.appendChild(d); termOut.scrollTop = termOut.scrollHeight; }
function toggleTerm(force){
  const open = force !== undefined ? force : !term.classList.contains("open");
  term.classList.toggle("open", open);
  if (open) {
    if (!termGreeted) { termGreeted = true; termPrint("WILDWOOD ZOO SYSTEMS  ·  (c) 2004 Wildwood Software\nType 'help' for commands or 'cheats' for the secret names.\n", "w"); }
    setTimeout(()=>termIn.focus(), 30);
  } else termIn.blur();
}
window.toggleTerm = toggleTerm;
document.getElementById("termBtn").onclick = () => toggleTerm();
document.getElementById("termClose").onclick = () => toggleTerm(false);
termIn.addEventListener("keydown", e => {
  e.stopPropagation();
  if (e.key === "`" || e.key === "~") { e.preventDefault(); toggleTerm(false); return; }
  if (e.key === "ArrowUp") { if (termHi > 0) termIn.value = termHist[--termHi]; e.preventDefault(); return; }
  if (e.key === "ArrowDown") { if (termHi < termHist.length) { termHi++; termIn.value = termHist[termHi] || ""; } e.preventDefault(); return; }
  if (e.key === "Escape") { toggleTerm(false); return; }
  if (e.key !== "Enter") return;
  const line = termIn.value; termIn.value = "";
  if (!line.trim()) return;
  termHist.push(line); termHi = termHist.length;
  termPrint("> " + line, "u");
  const c = line.trim().toLowerCase();
  if (c === "clear" || c === "cls") { termOut.innerHTML = ""; return; }
  if (c === "exit" || c === "quit") { toggleTerm(false); return; }
  putStr(line);
  let selE = -1, selT = -1;
  if (selected && selected.kind === 'ent') selE = selected.id;
  if (selected && selected.kind === 'tile') selT = selected.y*W + selected.x;
  const out = outStr(X.terminal(selE, selT));
  termPrint(out + "\n", /^Cheat activated/m.test(out) ? "w" : "");
  refreshInfo(true);
});

buildOrder();
boot().catch(e => { document.getElementById("loading").textContent = "Failed to start: " + e; });
</script>
